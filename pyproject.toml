[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "gats"
version = "0.2.0"
description = "GATS: event-driven research and trading platform for Indian equities."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Chaitanya", email = "chaitanyachode@gmail.com" }]
dependencies = [
    "httpx>=0.27,<1",
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "typer>=0.12",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# Research: statistics (numpy), research frames (Parquet via pyarrow), plots.
research = ["numpy>=1.26", "pyarrow>=15", "matplotlib>=3.8"]
dev = [
    "gats[research]",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[project.scripts]
gats = "gats.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/gats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["gats"]
strict = true
warn_unreachable = true

# pyarrow ships no type information; it is only used to write Parquet files.
[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
